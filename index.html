<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08101a">
  <meta name="description" content="ExamForge free CBT practice for major competitive exams with bilingual OCR scanner, OCR history, question parser, and custom subject tagging.">
  <title>ExamForge</title>
  <style>
    html, body, #root {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }
    html {
      background: #08101a;
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
    }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: #08101a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    *, ::before, ::after {
      box-sizing: border-box;
    }
    button, input, select, textarea {
      font: inherit;
    }
    button {
      -webkit-tap-highlight-color: transparent;
    }
    input, textarea, select {
      max-width: 100%;
    }
    ::selection {
      background: rgba(99,102,241,.35);
    }
    :focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }
    @media (max-width: 600px) {
      body {
        min-width: 320px;
      }
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:grid;place-items:center;background:#08101a;color:#cbd5e1;font:14px system-ui;">
      Loading ExamForge...
    </div>
  </div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef } = React;

    /* =========================
       OCR UTILITIES
       ========================= */

    const OCR_DEFAULTS = {
      language: "hin+eng",
      removePageNumbers: true,
      removeHeaders: true,
      removeFooters: true,
      removeDuplicates: true,
      parseQuestions: true,
      detectCode: true
    };

    function normaliseOCRText(text) {
      return text
        .replace(/
/g, "")
        .replace(/[ \t]+/g, " ")
        .replace(/
{3,}/g, "

")
        .replace(/[“”]/g, '"')
        .replace(/[‘’]/g, "'")
        .replace(/[−–—]/g, "-")
        .trim();
    }

    function looksLikePageNumber(line) {
      const value = line.trim();
      return (
        /^d{1,4}$/.test(value) ||
        /^pages*d{1,4}$/i.test(value) ||
        /^d{1,4}s*/s*d{1,4}$/.test(value)
      );
    }

    function removeRepeatedHeadersAndFooters(lines) {
      if (lines.length < 8) return lines;

      const firstLines = lines.slice(0, 5).map(x => x.trim()).filter(Boolean);
      const lastLines = lines.slice(-5).map(x => x.trim()).filter(Boolean);
      const frequency = {};

      [...firstLines, ...lastLines].forEach(line => {
        const key = line.toLowerCase().replace(/s+/g, " ");
        frequency[key] = (frequency[key] || 0) + 1;
      });

      return lines.filter(line => {
        const key = line.trim().toLowerCase().replace(/s+/g, " ");
        if (!key) return true;
        if (frequency[key] >= 2 && key.length < 100) return false;
        return true;
      });
    }

    function cleanOCRText(rawText, options = OCR_DEFAULTS) {
      let lines = normaliseOCRText(rawText)
        .split("
")
        .map(line => line.trim())
        .filter(Boolean);

      if (options.removePageNumbers) {
        lines = lines.filter(line => !looksLikePageNumber(line));
      }

      if (options.removeDuplicates) {
        const seen = new Set();
        lines = lines.filter(line => {
          const key = line.toLowerCase().replace(/s+/g, " ");
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      if (options.removeHeaders || options.removeFooters) {
        lines = removeRepeatedHeadersAndFooters(lines);
      }

      return lines.join("
").trim();
    }

    function fixCommonOCRMistakes(text) {
      return text
        .replace(/\bO(?=d)/g, "0")
        .replace(/(?<=d)O\b/g, "0")
        .replace(/\bl(?=d)/g, "1")
        .replace(/\bI(?=d)/g, "1")
        .replace(/(d)s*xs*(d)/gi, "$1 × $2")
        .replace(/(d)s*^s*(d)/g, "$1^$2")
        .replace(/s+([,.!?;:])/g, "$1")
        .replace(/([([{])s+/g, "$1")
        .replace(/s+([)]}])/g, "$1");
    }

    function checkCodeLineByLine(code) {
      const lines = code.split("
");
      const errors = [];
      const fixedLines = [];

      lines.forEach((line, index) => {
        let fixed = line;

        const opens = (line.match(/[([{]/g) || []).length;
        const closes = (line.match(/[)]}]/g) || []).length;

        if (opens !== closes) {
          errors.push({
            line: index + 1,
            type: "bracket",
            message: "Possible unmatched bracket."
          });
        }

        if (/^s*prints+[^(]/.test(line)) {
          fixed = line.replace(/^(s*)prints+(.+)$/, "$1print($2)");
          errors.push({
            line: index + 1,
            type: "syntax",
            message: "Possible Python print syntax issue.",
            correction: fixed
          });
        }

        if (/\bOs*=s*d/.test(line)) {
          const proposed = line.replace(/\bO\b/g, "0");
          errors.push({
            line: index + 1,
            type: "ocr",
            message: "Letter O may have been read instead of zero.",
            correction: proposed
          });
        }

        fixedLines.push(fixed);
      });

      return {
        original: code,
        corrected: fixedLines.join("
"),
        errors
      };
    }

    function parseQuestionsFromOCR(text) {
      const lines = text.split("
").map(l => l.trim()).filter(Boolean);
      const questions = [];
      let current = null;
      let optionBuffer = [];

      function flushCurrent() {
        if (!current) return;
        if (optionBuffer.length > 0) {
          current.opts = optionBuffer;
          optionBuffer = [];
        }
        if (current.t && current.opts && current.opts.length >= 2) {
          questions.push({
            id: "ocr_q" + (questions.length + 1),
            subj: "Mixed",
            t: current.t,
            opts: current.opts,
            ans: [],
            pos: 4,
            neg: 1,
            state: "NV",
            picked: [],
            numVal: "",
            bookmarked: false,
            type: "MCQ",
            diff: "Medium",
            source: "ocr"
          });
        }
        current = null;
      }

      const qStartPatterns = [
        /^d+.s+/,
        /^Qd+[.:]?s*/i,
        /^Questions+d+[.:]?s*/i
      ];

      const optionPatterns = [
        /^s*([A-D])[.)]s*(.*)$/i,
        /^s*((w))s*(.*)$/i,
        /^s*(w+)s*[:-]s*(.*)$/i
      ];

      lines.forEach(line => {
        let isQuestionStart = false;
        for (const pat of qStartPatterns) {
          if (pat.test(line)) {
            isQuestionStart = true;
            break;
          }
        }

        if (isQuestionStart) {
          flushCurrent();
          current = {
            t: line.replace(qStartPatterns.find(p => p.test(line)), "").trim()
          };
          return;
        }

        if (current) {
          let matchedOption = false;
          for (const pat of optionPatterns) {
            const m = line.match(pat);
            if (m) {
              matchedOption = true;
              optionBuffer.push(m[2].trim());
              break;
            }
          }
          if (!matchedOption) {
            if (line.length > 6 && optionBuffer.length === 0) {
              current.t += " " + line;
              current.t = current.t.replace(/s+/g, " ").trim();
            } else if (line.length > 3 && optionBuffer.length > 0 && optionBuffer.length < 6) {
              optionBuffer.push(line);
            }
          }
        }
      });

      flushCurrent();
      return questions;
    }

    /* =========================
       OCR SCANNER COMPONENT
       ========================= */

    function OCRScanner({ onComplete, onClose }) {
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState("");
      const [text, setText] = useState("");
      const [status, setStatus] = useState("Choose an image");
      const [progress, setProgress] = useState(0);
      const [busy, setBusy] = useState(false);
      const inputRef = useRef(null);

      function handleFile(event) {
        const selected = event.target.files?.[0];
        if (!selected) return;
        if (!selected.type.startsWith("image/")) {
          setStatus("Please select an image file.");
          return;
        }
        setFile(selected);
        setPreview(URL.createObjectURL(selected));
        setText("");
        setStatus("Image ready for scanning.");
        setProgress(0);
      }

      async function scanImage() {
        if (!file || busy) return;

        setBusy(true);
        setText("");
        setProgress(0);
        setStatus("Preparing OCR engine (Hindi + English)...");

        try {
          const result = await Tesseract.recognize(file, "hin+eng", {
            logger(message) {
              if (message.status === "recognizing text") {
                const percentage = Math.round((message.progress || 0) * 100);
                setProgress(percentage);
                setStatus(`Reading text... ${percentage}%`);
              } else if (message.status) {
                setStatus(message.status);
              }
            }
          });

          const cleaned = cleanOCRText(result.data.text, OCR_DEFAULTS);
          const corrected = fixCommonOCRMistakes(cleaned);

          setText(corrected);
          setStatus("OCR completed. Review the extracted text.");
          setProgress(100);
        } catch (error) {
          console.error("OCR error:", error);
          setStatus("OCR failed. Try a clearer or brighter image.");
        } finally {
          setBusy(false);
        }
      }

      function saveResult() {
        const value = text.trim();
        if (!value) {
          setStatus("There is no extracted text to save.");
          return;
        }
        const parsed = parseQuestionsFromOCR(value);
        onComplete({
          rawText: value,
          cleanedText: value,
          parsedQuestions: parsed,
          createdAt: Date.now(),
          source: file?.name || "camera-image"
        });
      }

      return (
        <div style={{
          position: "fixed",
          inset: 0,
          zIndex: 2000,
          background: "#07111f",
          color: "#fff",
          display: "flex",
          flexDirection: "column"
        }}>
          <div style={{
            padding: "14px 16px",
            background: "#172554",
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center"
          }}>
            <strong>Scan Questions and Answers</strong>
            <button onClick={onClose} style={{
              background: "transparent",
              color: "#fff",
              border: "1px solid rgba(255,255,255,.3)",
              borderRadius: 7,
              padding: "6px 10px",
              cursor: "pointer"
            }}>
              Close
            </button>
          </div>

          <div style={{
            flex: 1,
            overflow: "auto",
            padding: 16,
            maxWidth: 900,
            width: "100%",
            margin: "0 auto",
            boxSizing: "border-box"
          }}>
            <input
              ref={inputRef}
              type="file"
              accept="image/*"
              capture="environment"
              onChange={handleFile}
              style={{ display: "none" }}
            />

            <button
              onClick={() => inputRef.current?.click()}
              style={{
                width: "100%",
                padding: 14,
                background: "#4f46e5",
                color: "#fff",
                border: 0,
                borderRadius: 10,
                fontWeight: 800,
                cursor: "pointer",
                marginBottom: 12
              }}
            >
              Take Photo or Choose Image
            </button>

            {preview && (
              <img
                src={preview}
                alt="Selected page"
                style={{
                  width: "100%",
                  maxHeight: 360,
                  objectFit: "contain",
                  background: "#000",
                  borderRadius: 10,
                  marginBottom: 12
                }}
              />
            )}

            <button
              onClick={scanImage}
              disabled={!file || busy}
              style={{
                width: "100%",
                padding: 14,
                background: !file || busy ? "#475569" : "#059669",
                color: "#fff",
                border: 0,
                borderRadius: 10,
                fontWeight: 800,
                cursor: !file || busy ? "not-allowed" : "pointer"
              }}
            >
              {busy ? `Scanning... ${progress}%` : "Extract Text (Hindi+English)"}
            </button>

            <div style={{
              marginTop: 12,
              color: "#cbd5e1",
              fontSize: 13
            }}>
              {status}
            </div>

            <textarea
              value={text}
              onChange={event => setText(event.target.value)}
              placeholder="Extracted text will appear here..."
              style={{
                width: "100%",
                minHeight: 300,
                marginTop: 14,
                padding: 14,
                boxSizing: "border-box",
                borderRadius: 10,
                border: "1px solid #334155",
                background: "#0f172a",
                color: "#fff",
                resize: "vertical",
                lineHeight: 1.6
              }}
            />

            <button
              onClick={saveResult}
              style={{
                width: "100%",
                marginTop: 12,
                padding: 14,
                background: "#f59e0b",
                color: "#111827",
                border: 0,
                borderRadius: 10,
                fontWeight: 900,
                cursor: "pointer"
              }}
            >
              Save Extracted Content
            </button>
          </div>
        </div>
      );
    }

    /* =========================
       OCR HISTORY SCREEN
       ========================= */

    function OCRHistoryScreen({ onBack, onUseDocument }) {
      const [docs, setDocs] = useState([]);

      useEffect(() => {
        try {
          const stored = JSON.parse(localStorage.getItem("ocr_documents") || "[]");
          setDocs(stored);
        } catch (e) {
          console.error("OCR history load error:", e);
        }
      }, []);

      return (
        <div style={{ height: "100%", background: "#08101a", display: "flex", flexDirection: "column" }}>
          <div style={{ background: "#1a237e", padding: "12px 16px", display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
            <button onClick={onBack} style={{ background: "none", border: "none", color: "#fff", fontSize: 22, cursor: "pointer" }}>‹</button>
            <div style={{ color: "#fff", fontWeight: 900, fontSize: 14 }}>OCR History</div>
          </div>
          <div style={{ flex: 1, overflow: "auto", padding: 16 }}>
            {docs.length === 0 ? (
              <div style={{ color: "rgba(255,255,255,.5)", fontSize: 13, textAlign: "center", marginTop: 40 }}>
                No scanned documents yet. Use "Scan Questions from Book" on the home screen.
              </div>
            ) : (
              docs.map((d, i) => (
                <div key={i} style={{ background: "rgba(255,255,255,.05)", border: "1px solid rgba(255,255,255,.1)", borderRadius: 12, padding: 14, marginBottom: 12 }}>
                  <div style={{ color: "#a5b4fc", fontSize: 11, marginBottom: 6 }}>
                    {new Date(d.createdAt).toLocaleString()} • {d.source}
                  </div>
                  <div style={{ color: "#fff", fontSize: 13, marginBottom: 8, maxHeight: 120, overflow: "auto", whiteSpace: "pre-wrap" }}>
                    {d.cleanedText.slice(0, 400)}{d.cleanedText.length > 400 ? "..." : ""}
                  </div>
                  {d.parsedQuestions && d.parsedQuestions.length > 0 && (
                    <div style={{ color: "rgba(255,255,255,.5)", fontSize: 11, marginBottom: 6 }}>
                      Parsed {d.parsedQuestions.length} question(s)
                    </div>
                  )}
                  <button
                    onClick={() => onUseDocument(d)}
                    style={{
                      background: "#6366f1",
                      color: "#fff",
                      border: "none",
                      borderRadius: 8,
                      padding: "8px 12px",
                      fontSize: 12,
                      fontWeight: 700,
                      cursor: "pointer"
                    }}
                  >
                    View & Use
                  </button>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    /* =========================
       OCR DOCUMENT VIEWER WITH CUSTOM SUBJECT
       ========================= */

    function OCRDocumentViewer({ doc, onBack, onAddQuestionsToBank }) {
      const [text, setText] = useState(doc?.cleanedText || "");
      const [questions, setQuestions] = useState(doc?.parsedQuestions || []);
      const [subjectMode, setSubjectMode] = useState("auto");
      const [customSubject, setCustomSubject] = useState("");

      useEffect(() => {
        if (!doc) return;
        setText(doc.cleanedText || "");
        setQuestions(doc.parsedQuestions || []);
      }, [doc]);

      function reParse() {
        const parsed = parseQuestionsFromOCR(text);
        setQuestions(parsed);
      }

      function applySubjectAndSave() {
        let finalQuestions = questions.map(q => ({ ...q }));

        if (subjectMode === "fixed") {
          const subj = customSubject.trim() || "Custom";
          finalQuestions = finalQuestions.map(q => ({ ...q, subj }));
        } else if (subjectMode === "ask") {
          // For simplicity in this single-file app, we just keep "Mixed"
          // A more advanced UI could ask per-question; here we just tag all as Mixed.
          finalQuestions = finalQuestions.map(q => ({ ...q, subj: "Mixed" }));
        }

        const updated = { ...doc, cleanedText: text, parsedQuestions: finalQuestions };
        const previous = JSON.parse(localStorage.getItem("ocr_documents") || "[]");
        const idx = previous.findIndex(d => d.createdAt === doc.createdAt && d.source === doc.source);
        if (idx >= 0) {
          previous[idx] = updated;
        } else {
          previous.unshift(updated);
        }
        localStorage.setItem("ocr_documents", JSON.stringify(previous.slice(0, 100)));

        onAddQuestionsToBank(finalQuestions);
      }

      return (
        <div style={{ height: "100%", background: "#08101a", display: "flex", flexDirection: "column" }}>
          <div style={{ background: "#1a237e", padding: "12px 16px", display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
            <button onClick={onBack} style={{ background: "none", border: "none", color: "#fff", fontSize: 22, cursor: "pointer" }}>‹</button>
            <div style={{ color: "#fff", fontWeight: 900, fontSize: 14 }}>OCR Document</div>
          </div>
          <div style={{ flex: 1, overflow: "auto", padding: 16 }}>
            <div style={{ color: "rgba(255,255,255,.5)", fontSize: 11, marginBottom: 6 }}>
              {new Date(doc.createdAt).toLocaleString()} • {doc.source}
            </div>

            <div style={{ marginBottom: 16 }}>
              <div style={{ color: "#fff", fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Extracted Text (editable)</div>
              <textarea
                value={text}
                onChange={e => setText(e.target.value)}
                style={{
                  width: "100%",
                  minHeight: 200,
                  padding: 12,
                  boxSizing: "border-box",
                  borderRadius: 10,
                  border: "1px solid #334155",
                  background: "#0f172a",
                  color: "#fff",
                  resize: "vertical",
                  lineHeight: 1.6
                }}
              />
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <button
                  onClick={reParse}
                  style={{
                    background: "#10b981",
                    color: "#fff",
                    border: "none",
                    borderRadius: 8,
                    padding: "8px 12px",
                    fontSize: 12,
                    fontWeight: 700,
                    cursor: "pointer"
                  }}
                >
                  Re‑parse Questions
                </button>
              </div>
            </div>

            <div style={{ marginBottom: 16 }}>
              <div style={{ color: "#fff", fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Subject Tagging for OCR Questions</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
                <button
                  onClick={() => setSubjectMode("auto")}
                  style={{
                    background: subjectMode === "auto" ? "#6366f1" : "rgba(255,255,255,.07)",
                    color: subjectMode === "auto" ? "#fff" : "rgba(255,255,255,.6)",
                    border: "none",
                    borderRadius: 8,
                    padding: "8px 12px",
                    fontSize: 12,
                    fontWeight: 700,
                    cursor: "pointer"
                  }}
                >
                  Keep Auto (Mixed)
                </button>
                <button
                  onClick={() => setSubjectMode("fixed")}
                  style={{
                    background: subjectMode === "fixed" ? "#6366f1" : "rgba(255,255,255,.07)",
                    color: subjectMode === "fixed" ? "#fff" : "rgba(255,255,255,.6)",
                    border: "none",
                    borderRadius: 8,
                    padding: "8px 12px",
                    fontSize: 12,
                    fontWeight: 700,
                    cursor: "pointer"
                  }}
                >
                  Use One Subject for All
                </button>
              </div>

              {subjectMode === "fixed" && (
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <select
                    value={customSubject}
                    onChange={e => setCustomSubject(e.target.value)}
                    style={{
                      background: "rgba(255,255,255,.08)",
                      color: "#fff",
                      border: "1px solid rgba(255,255,255,.2)",
                      borderRadius: 8,
                      padding: "8px 10px",
                      fontSize: 13
                    }}
                  >
                    <option value="">-- Choose --</option>
                    <option value="Physics">Physics</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Biology">Biology</option>
                    <option value="Custom">Custom (type below)</option>
                  </select>
                  {customSubject === "Custom" && (
                    <input
                      value={customSubject === "Custom" ? "" : customSubject}
                      onChange={e => setCustomSubject(e.target.value)}
                      placeholder="Type custom subject (e.g. History, English)"
                      style={{
                        background: "rgba(255,255,255,.08)",
                        color: "#fff",
                        border: "1px solid rgba(255,255,255,.2)",
                        borderRadius: 8,
                        padding: "8px 10px",
                        fontSize: 13,
                        minWidth: 200
                      }}
                    />
                  )}
                </div>
              )}
            </div>

            <div>
              <div style={{ color: "#fff", fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Parsed Questions ({questions.length})</div>
              {questions.length === 0 ? (
                <div style={{ color: "rgba(255,255,255,.5)", fontSize: 12 }}>
                  No questions parsed yet. Adjust the text above and click "Re‑parse Questions".
                </div>
              ) : (
                questions.map((q, i) => (
                  <div key={i} style={{ background: "rgba(255,255,255,.05)", border: "1px solid rgba(255,255,255,.1)", borderRadius: 10, padding: 12, marginBottom: 10 }}>
                    <div style={{ color: "#a5b4fc", fontSize: 11, marginBottom: 4 }}>Q{i + 1} • {q.subj}</div>
                    <div style={{ color: "#fff", fontSize: 13, marginBottom: 8 }}>{q.t}</div>
                    {q.opts && q.opts.length > 0 && (
                      <div style={{ color: "rgba(255,255,255,.7)", fontSize: 12 }}>
                        {q.opts.map((o, oi) => (
                          <div key={oi} style={{ marginBottom: 3 }}>
                            {String.fromCharCode(65 + oi)}. {o}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ))
              )}
              {questions.length > 0 && (
                <button
                  onClick={applySubjectAndSave}
                  style={{
                    width: "100%",
                    marginTop: 12,
                    background: "#f59e0b",
                    color: "#111827",
                    border: "none",
                    borderRadius: 10,
                    padding: 12,
                    fontSize: 13,
                    fontWeight: 900,
                    cursor: "pointer"
                  }}
                >
                  Add All Parsed Questions to Question Bank
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* =========================
       EXAM DATABASE

    function buildQs(subj, pool, n, pos, neg, extraQs = []) {
      const allPool = [...extraQs.filter(q => q.subj === subj), ...pool];
      const out = [];
      for (let i = 0; i < n; i++) {
        const q = allPool[i % allPool.length];
        out.push({
          id: (q.id || `${subj}${i + 1}`),
          subj,
          t: q.t,
          opts: q.opts,
          ans: q.ans || [],
          pos,
          neg,
          state: "NV",
          picked: [],
          numVal: "",
          bookmarked: false,
          type: q.type || "MCQ",
          diff: q.diff || "Medium",
          source: q.source || "bank"
        });
      }
      return out;
    }

    function buildExam(exam, ocrBank = []) {
      const out = {};
      const poolMap = {
        Physics: PHYS,
        Chemistry: CHEM,
        Mathematics: MATH,
        Biology: BIO,
        "Reading & Writing": CHEM,
        Math: MATH,
        Verbal: CHEM,
        "Data Insights": MATH,
        Listening: CHEM,
        Reading: MATH,
        Technical: PHYS,
        GA: MATH,
        Reasoning: MATH,
        English: CHEM,
        Quant: MATH,
        GK: BIO,
        CSAT: MATH,
        "GS Paper I": BIO
      };

      exam.subj.forEach(sv => {
        const pool = poolMap[sv] || PHYS;
        const n = Math.max(5, Math.ceil(exam.totalQ / 30 / exam.subj.length));
        const actualN = exam.id.includes("JEEMAIN") && (sv === "Physics" || sv === "Chemistry" || sv === "Mathematics") ? 20 : n;
        out[sv] = buildQs(sv, pool, actualN, exam.pos, exam.neg, ocrBank);
      });

      return out;
    }

    function AuthScreen({ onAuth }) {
      const [tab, setTab] = useState("login");
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [pass, setPass] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      async function sha256(s) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      }

      async function doLogin() {
        if (!email.trim() || !pass.trim()) {
          setErr("Fill all fields.");
          return;
        }
        setBusy(true);
        setErr("");

        const hash = await sha256(pass + "xp2025");
        const db = JSON.parse(localStorage.getItem("usersdb") || "{}");
        const u = db[email.toLowerCase()];

        if (!u || u.passHash !== hash) {
          setErr("Wrong email or password.");
          setBusy(false);
          return;
        }

        localStorage.setItem("activesession", JSON.stringify({ email: email.toLowerCase(), ts: Date.now() }));
        onAuth(u);
        setBusy(false);
      }

      async function doRegister() {
        if (!name.trim() || !email.trim() || !pass.trim()) {
          setErr("Fill all fields.");
          return;
        }
        if (pass.length < 6) {
          setErr("Password must be 6+ characters.");
          return;
        }
        setBusy(true);
        setErr("");

        const db = JSON.parse(localStorage.getItem("usersdb") || "{}");
        if (db[email.toLowerCase()]) {
          setErr("Email already registered.");
          setBusy(false);
          return;
        }

        const hash = await sha256(pass + "xp2025");
        const uid = Date.now();
        const user = {
          id: uid,
          name: name.trim(),
          email: email.toLowerCase(),
          passHash: hash,
          plan: "free",
          planExpiry: 0,
          country: "IN",
          joined: Date.now(),
          data: { results: [], streak: 0, lastStudy: null, goals: null, xp: 0, ocrBank: [] }
        };

        db[user.email] = user;
        localStorage.setItem("usersdb", JSON.stringify(db));
        localStorage.setItem("activesession", JSON.stringify({ email: user.email, ts: Date.now() }));
        onAuth(user);
        setBusy(false);
      }

              <div style={{ display: "flex", marginBottom: 20, background: "rgba(255,255,255,.06)", borderRadius: 12, padding: 4 }}>
                {["login", "register"].map(t => (
                  <button key={t} onClick={() => { setTab(t); setErr(""); }} style={{ flex: 1, padding: "9px", background: tab === t ? "#6366f1" : "transparent", color: tab === t ? "#fff" : "rgba(255,255,255,.4)", border: "none", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700 }}>

                <div>Total Questions: <b style={{ color: "#fff" }}>{totalQ}</b></div>
                <div>Duration: <b style={{ color: "#fff" }}>{exam.dur} minutes</b></div>
                <div>Marking: <b style={{ color: "#10b981" }}>+{exam.pos}</b> correct, <b style={{ color: "#ef4444" }}>-{exam.neg}</b> wrong, 0 unattempted</div>
                <div>Sections: <b style={{ color: "#fff" }}>{exam.subj.join(", ")}</b></div>

    /* =========================
       ACTIVE EXAM (abbreviated)
       ========================= */

    const PALCOLORS = {
      notvisited: "#6b7280",
      notanswered: "#ef4444",
      answered: "#10b981",
      markedreview: "#8b5cf6",
      answeredmarked: "#6366f1"
    };

    function ActiveExam({ exam, questions, onSubmit }) {
      const subjs = Object.keys(questions);
      const allQ = subjs.flatMap(sv => questions[sv].map(q => ({ ...q, subj: sv })));
      const [qs, setQs] = useState(allQ);
      const [cur, setCur] = useState(0);
      const [subj, setSubj] = useState(subjs[0]);
      const [showPal, setShowPal] = useState(true);
      const [showConfirm, setShowConfirm] = useState(false);
      const doneRef = useRef(false);
      const qsRef = useRef(qs);

      useEffect(() => { qsRef.current = qs; }, [qs]);

      function useTimer(totalSec, onEnd) {
        const [left, setLeft] = useState(totalSec);
        const doneRef = useRef(false);
        const leftRef = useRef(totalSec);
        const onEndRef = useRef(onEnd);

        useEffect(() => { onEndRef.current = onEnd; }, [onEnd]);
        useEffect(() => { leftRef.current = totalSec; setLeft(totalSec); doneRef.current = false; }, [totalSec]);

        useEffect(() => {
          const id = setInterval(() => {
            setLeft(p => {
              const n = p - 1;
              leftRef.current = Math.max(0, n);
              if (n <= 0 && !doneRef.current) {
                doneRef.current = true;
                clearInterval(id);
                onEndRef.current?.();
              }
              return Math.max(0, n);
            });
          }, 1000);
          return () => clearInterval(id);
        }, [totalSec]);

        const fmt = s => String(Math.floor(s / 3600)).padStart(2, "0") + ":" + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
        return { left, leftRef, fmt, warn: left < 300, crit: left < 60 };
      }

      const timer = useTimer(exam.dur * 60, doSubmit);
      const isNTA = ["NTA", "NTAADV", "NEET"].includes(exam.ui);

      const curQ = qs[cur];
      const subjQs = qs.filter(q => q.subj === subj);
      const subjStart = qs.findIndex(q => q.subj === subj);
      const answered = qs.filter(q => q.state === "ANS" || q.state === "AM").length;
      const notDone = qs.filter(q => q.state === "NV" || q.state === "NA").length;
      const markedR = qs.filter(q => q.state === "MR" || q.state === "AM").length;

      function upd(i, patch) {
        setQs(prev => {
          const n = [...prev];
          n[i] = { ...n[i], ...patch };
          return n;
        });
      }

      function pick(opt) {
        if (!curQ) return;
        if (curQ.type === "MULTI") {
          const p = curQ.picked.includes(opt) ? curQ.picked.filter(x => x !== opt) : [...curQ.picked, opt];
          upd(cur, { picked: p, state: p.length ? "ANS" : "NA" });
        } else {
          upd(cur, { picked: [opt], state: "ANS" });
        }
      }

      function navTo(idx) {
        setCur(idx);
        const q = qs[idx];
        if (q.state === "NV") upd(idx, { state: "NA" });
      }

      function saveNext() {
        upd(cur, { state: curQ.type === "NUM" ? (String(curQ.numVal).trim() ? "ANS" : "NA") : (curQ.picked.length ? "ANS" : "NA") });
        if (cur < qs.length - 1) navTo(cur + 1);
      }

      function markReview() {
        upd(cur, { state: curQ.type === "NUM" ? (String(curQ.numVal).trim() ? "AM" : "MR") : (curQ.picked.length ? "AM" : "MR") });
        if (cur < qs.length - 1) navTo(cur + 1);
      }

      function clearResp() {
        upd(cur, { picked: [], numVal: "", state: "NA" });
      }

      useEffect(() => {
        if (curQ && curQ.state === "NV") upd(cur, { state: "NA" });
      }, [cur]);

      function doSubmit() {
        if (doneRef.current) return;
        doneRef.current = true;

        const finalQs = qsRef.current;
        let score = 0, total = 0, correct = 0, wrong = 0, skipped = 0;
        const bySubj = {};

        finalQs.forEach(q => {
          const sv = q.subj;
          if (!bySubj[sv]) bySubj[sv] = { score: 0, correct: 0, wrong: 0, skipped: 0, total: 0 };
          bySubj[sv].total += q.pos;

          const answered = q.type === "NUM" ? String(q.numVal).trim() !== "" : q.picked.length > 0;
          if (!answered) {
            skipped++;
            bySubj[sv].skipped++;
            q.result = "skip";
          } else {
            const ok = q.ans.every(a => q.picked.includes(a)) && q.picked.every(a => q.ans.includes(a));
            if (ok) {
              score += q.pos;
              correct++;
              bySubj[sv].score += q.pos;
              bySubj[sv].correct++;
              q.result = "correct";
            } else {
              score -= q.neg || 0;
              wrong++;
              bySubj[sv].score -= q.neg || 0;
              bySubj[sv].wrong++;
              q.result = "wrong";
            }
          }
        });

        onSubmit({ exam, score, total, correct, wrong, skipped, bySubj, questions: finalQs, timeTaken: exam.dur * 60 - timer.left, totalQ: finalQs.length });
      }

      function PalettePanel({ onClose }) {
        return (
          <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "#f5f5f5", minWidth: 180 }}>
            <div style={{ background: "#283593", padding: "8px 10px", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
              <span style={{ color: "#fff", fontWeight: 800, fontSize: 11 }}>Question Paper</span>
              {onClose && <button onClick={onClose} style={{ background: "none", border: "none", color: "#fff", cursor: "pointer", fontSize: 13, padding: "0 4px", opacity: onClose ? 1 : 0 }}>✕</button>}
            </div>
            <div style={{ display: "flex", background: "#e8eaf6", borderBottom: "1px solid #c5cae9", flexShrink: 0, overflowX: "auto" }}>
              {subjs.map(sv => (
                <button key={sv} onClick={() => setSubj(sv)} style={{ padding: "5px 10px", background: subj === sv ? "#fff" : "transparent", color: subj === sv ? "#1a237e" : "#555", border: "none", cursor: "pointer", fontSize: 10, fontWeight: 700, flexShrink: 0, borderBottom: subj === sv ? "2px solid #1a237e" : "none" }}>
                  {sv.substring(0, 4)}
                </button>
              ))}
            </div>
            <div style={{ padding: "6px 8px", display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 4, flex: 1, overflowY: "auto", alignContent: "start" }}>
              {subjQs.map((q, i) => {
                const idx = subjStart + i;
                const isActive = idx === cur;
                return (
                  <button key={q.id} onClick={() => { setCur(idx); if (q.state === "NV") upd(idx, { state: "NA" }); if (onClose) onClose(); }} style={{ aspectRatio: 1, background: PALCOLORS[q.state] || "#6b7280", color: "#fff", border: isActive ? "3px solid #000" : "1.5px solid transparent", borderRadius: isActive ? 4 : 4, fontSize: 10, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: isActive ? "0 0 0 1px #fff inset" : "none" }}>
                    {i + 1}
                  </button>
                );
              })}
            </div>
            <div style={{ padding: "6px 10px", borderTop: "1px solid #ddd", flexShrink: 0 }}>
              {Object.entries(PALCOLORS).map(([s, c]) => (
                <div key={s} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 3 }}>
                  <div style={{ width: 14, height: 14, borderRadius: 3, background: c }}></div>
                  <span style={{ fontSize: 9, color: "#555" }}>{s.replace(/([A-Z])/g, " $1")}</span>
                  <span style={{ fontSize: 9, color: "#888", marginLeft: "auto" }}>{qs.filter(q => q.state === s).length}</span>
                </div>
              ))}
            </div>
            <div style={{ padding: "8px 10px", background: "#e8eaf6", flexShrink: 0 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 4, fontSize: 10, color: "#333", marginBottom: 8 }}>
                <span style={{ color: "#1b5e20", fontWeight: 700 }}>Done: {answered}</span>
                <span style={{ color: "#c62828", fontWeight: 700 }}>Left: {notDone}</span>
              </div>
              <button onClick={() => setShowConfirm(true)} style={{ width: "100%", background: "#1b5e20", color: "#fff", border: "none", borderRadius: 5, padding: "9px", fontSize: 11, fontWeight: 800, cursor: "pointer" }}>Submit Test</button>
            </div>
          </div>
        );
      }

      return (
        <div style={{ height: "100dvh", minHeight: "100vh", width: "100vw", background: "#0a0a1a", display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <div style={{ background: exam.color || "#1a237e", padding: "8px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
            <div>
              <div style={{ color: "#fff", fontWeight: 900, fontSize: 13 }}>{exam.name}</div>
              <div style={{ color: "rgba(255,255,255,.6)", fontSize: 10 }}>{exam.country} - Official Pattern</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ fontFamily: "monospace", fontWeight: 900, fontSize: 15, background: timer.crit ? "#c62828" : timer.warn ? "#e65100" : "rgba(0,0,0,.3)", color: "#fff", padding: "5px 12px", borderRadius: 6 }}>
                {timer.fmt(timer.left)}
              </div>
              <button onClick={() => setShowPal(p => !p)} style={{ background: "rgba(255,255,255,.15)", border: "1px solid rgba(255,255,255,.3)", color: "#fff", borderRadius: 6, padding: "5px 10px", fontSize: 10, fontWeight: 700, cursor: "pointer" }}>
                {showPal ? "Hide Palette" : "Palette"}
              </button>
            </div>
          </div>
          <div style={{ background: "rgba(0,0,0,.3)", display: "flex", flexShrink: 0, overflowX: "auto", borderBottom: "1px solid rgba(255,255,255,.1)" }}>
            {subjs.map(sv => (
              <button key={sv} onClick={() => { setSubj(sv); const fi = qs.findIndex(q => q.subj === sv); if (fi >= 0) navTo(fi); }} style={{ padding: "8px 16px", background: subj === sv ? "rgba(255,255,255,.15)" : "transparent", color: subj === sv ? "#fff" : "rgba(255,255,255,.5)", border: "none", cursor: "pointer", fontSize: 11, fontWeight: 700, whiteSpace: "nowrap", borderBottom: subj === sv ? "2px solid #fff" : "2px solid transparent" }}>
                {sv}
              </button>
            ))}
          </div>
          <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
            <div style={{ flex: 1, overflow: "auto", padding: 16, background: "#fff" }}>
              {curQ && (
                <>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <span style={{ color: "#333", fontWeight: 700, fontSize: 12 }}>Q{cur + 1} / {qs.length}</span>
                      <span style={{ background: "#e8f5e9", color: "#2e7d32", borderRadius: 4, padding: "1px 6px", fontSize: 10, fontWeight: 700 }}>+{curQ.pos}</span>
                      {curQ.neg > 0 && <span style={{ background: "#ffebee", color: "#c62828", borderRadius: 4, padding: "1px 6px", fontSize: 10, fontWeight: 700 }}>-{curQ.neg}</span>}
                    </div>
                  </div>
                  <div style={{ fontSize: 14, lineHeight: 1.9, color: "#111", marginBottom: 18 }}>{curQ.t}</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
                    {curQ.opts.map((opt, oi) => {
                      const sel = curQ.picked.includes(oi);
                      return (
                        <button key={oi} onClick={() => pick(oi)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px", border: `2px solid ${sel ? "#1565c0" : "#e0e0e0"}`, borderRadius: 8, background: sel ? "#e3f2fd" : "#fff", cursor: "pointer", textAlign: "left" }}>
                          <div style={{ width: 24, height: 24, border: `2px solid ${sel ? "#1565c0" : "#ccc"}`, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, background: sel ? "#1565c0" : "transparent", color: sel ? "#fff" : "#888", fontSize: 11, fontWeight: 700 }}>
                            {String.fromCharCode(65 + oi)}
                          </div>
                          <span style={{ fontSize: 13, color: "#111", flex: 1 }}>{opt}</span>
                        </button>
                      );
                    })}
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", borderTop: "1px solid #eee", paddingTop: 12 }}>
                    <button onClick={saveNext} style={{ padding: "9px 14px", background: exam.color || "#1a237e", color: "#fff", border: "none", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 700 }}>Save & Next</button>
                    <button onClick={markReview} style={{ padding: "9px 14px", background: "#7b1fa2", color: "#fff", border: "none", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 700 }}>Mark Review</button>
                    <button onClick={clearResp} style={{ padding: "9px 14px", background: "#ef4444", color: "#fff", border: "none", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 700 }}>Clear</button>
                    <button onClick={() => { if (cur > 0) navTo(cur - 1); }} style={{ padding: "9px 14px", background: "#64748b", color: "#fff", border: "none", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 700 }}>Back</button>
                    <button onClick={() => setShowConfirm(true)} style={{ padding: "9px 18px", background: "#1b5e20", color: "#fff", border: "none", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 800, marginLeft: "auto" }}>Submit</button>
                  </div>
                </>
              )}
            </div>
            {showPal && (
              <div style={{ width: 200, flexShrink: 0, borderLeft: "1px solid #e0e0e0" }}>
                <PalettePanel onClose={() => setShowPal(false)} />
              </div>
            )}
          </div>
          {showConfirm && (
            <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.7)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
              <div style={{ background: "#fff", borderRadius: 12, padding: 24, maxWidth: 340, width: "100%", textAlign: "center" }}>
                <div style={{ fontWeight: 900, fontSize: 18, marginBottom: 12, color: "#111" }}>Submit Test?</div>
                <div style={{ color: "#555", fontSize: 13, marginBottom: 8 }}>{answered} answered, {notDone} remaining</div>
                <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
                  <button onClick={() => setShowConfirm(false)} style={{ flex: 1, padding: "12px", background: "#f5f5f5", color: "#333", border: "1px solid #ddd", borderRadius: 8, cursor: "pointer", fontWeight: 700 }}>Cancel</button>
                  <button onClick={() => { setShowConfirm(false); doSubmit(); }} style={{ flex: 1, padding: "12px", background: "#1b5e20", color: "#fff", border: "none", borderRadius: 8, cursor: "pointer", fontWeight: 800 }}>Submit</button>
                </div>
              </div>
</div>
          )}
        </div>
      );
    }

                  <div style={{ color: "rgba(255,255,255,.4)", fontSize: 12 }}>Time taken: {Math.floor(timeTaken / 60)}m {timeTaken % 60}s | Avg per question: {totalQ ? Math.round(timeTaken / totalQ) : 0}s</div>

    /* =========================
       GOALS SCREEN (abbreviated)
       ========================= */

    function GoalsScreen({ user, setUser, onBack }) {
      const dailyQ = useState(user.data?.goals?.dailyQ || 30)[0];
      const setDailyQ = useState(user.data?.goals?.dailyQ || 30)[1];
      const targetScore = useState(user.data?.goals?.targetScore || 80)[0];
      const setTargetScore = useState(user.data?.goals?.targetScore || 80)[1];
      const [saved, setSaved] = useState(false);

      function save() {
        const upd = { ...user, data: { ...user.data, goals: { ...user.data?.goals, dailyQ, targetScore } } };
        if (user.email && user.email !== "guest") {
          const db = JSON.parse(localStorage.getItem("usersdb") || "{}");
          db[user.email] = upd;
          localStorage.setItem("usersdb", JSON.stringify(db));
        }
        setUser(upd);
        setSaved(true);
        setTimeout(() => setSaved(false), 2000);
      }

      return (
        <div style={{ height: "100%", background: "#08101a", display: "flex", flexDirection: "column" }}>
          <div style={{ background: "#1a237e", padding: "12px 16px", display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
            <button onClick={onBack} style={{ background: "none", border: "none", color: "#fff", fontSize: 22, cursor: "pointer" }}>‹</button>
            <div style={{ color: "#fff", fontWeight: 900, fontSize: 14 }}>Study Goals</div>

          <div style={{ flex: 1, overflow: "auto", padding: 16 }}>

            <div style={{ background: "rgba(255,255,255,.05)", border: "1px solid rgba(255,255,255,.1)", borderRadius: 12, padding: 16, marginBottom: 12 }}>

              <span style={{ color: "#fff", fontWeight: 700, fontSize: 13 }}>{user.data?.streak || 0} days</span>

    /* =========================
       ROOT APP
       ========================= */

    function App() {
      const [user, setUserState] = useState(null);
      const [screen, setScreen] = useState("home");
      const [examFlow, setExamFlow] = useState(null);
      const [showOCR, setShowOCR] = useState(false);
      const [showOCRHistory, setShowOCRHistory] = useState(false);
      const [currentOCRDoc, setCurrentOCRDoc] = useState(null);
      const [ctrl, setCtrl] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("CTRLKEY") || "{}");
        } catch {
          return { apps: { free: true }, maintenance: false, features: [], announcements: [] };
        }
      });

      useEffect(() => {
        const s = JSON.parse(localStorage.getItem("activesession") || "null");
        if (s && Date.now() - s.ts < 30 * 24 * 3600000) {
          const db = JSON.parse(localStorage.getItem("usersdb") || "{}");
          if (db[s.email]) setUserState(db[s.email]);
        }
      }, []);

      function setUser(u) {
        setUserState(u);
        if (u && u.email && u.email !== "guest") {
          const db = JSON.parse(localStorage.getItem("usersdb") || "{}");
          db[u.email] = u;
          localStorage.setItem("usersdb", JSON.stringify(db));
        }
      }

      function nav(to) {
        setScreen(to);
        setExamFlow(null);
      }

      if (ctrl.apps?.free === false) {
        return (
          <div style={{ minHeight: "100vh", background: "#0a0a1a", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", textAlign: "center", padding: 20 }}>
            <div>
              <div style={{ fontSize: 48, marginBottom: 16 }}>🚧</div>
              <div style={{ fontSize: 20, fontWeight: 700 }}>App Offline</div>
              <div style={{ color: "rgba(255,255,255,.5)", marginTop: 8 }}>{ctrl.maintenanceMsg || "Back soon!"}</div>
            </div>
          </div>
        );
      }

      if (!user) {
        return <AuthScreen onAuth={u => { setUser(u); if (u.email && u.email !== "guest") localStorage.setItem("activesession", JSON.stringify({ email: u.email, ts: Date.now() })); }} />;
      }

      if (examFlow?.stage === "instructions") {
        return (
          <InstructionScreen
            exam={examFlow.exam}
            onBack={() => setExamFlow(null)}
            onStart={() => {
              const ocrBank = user.data?.ocrBank || [];
              const questions = buildExam(examFlow.exam, ocrBank);
              setExamFlow({ stage: "active", exam: examFlow.exam, questions });
            }}
          />
        );
      }

      if (examFlow?.stage === "active") {
        return (
          <ActiveExam
            exam={examFlow.exam}
            questions={examFlow.questions}
            onSubmit={r => {
              const res = { ...r, ts: Date.now(), userName: user.name };
              const upd = { ...user, data: { ...user.data, results: [res, ...(user.data?.results || [])].slice(0, 100), xp: (user.data?.xp || 0) + 50 } };
              setUser(upd);
              setExamFlow({ stage: "result", result: res });
            }}
          />
        );
      }

      if (examFlow?.stage === "result") {
        return (
          <ResultScreen
            result={examFlow.result}
            onBack={() => { setExamFlow(null); setScreen("home"); }}
            onRetake={() => {
              const ocrBank = user.data?.ocrBank || [];
              const questions = buildExam(examFlow.result.exam, ocrBank);
              setExamFlow({ stage: "active", exam: examFlow.result.exam, questions });
            }}
          />
        );
      }

      if (showOCR) {
        return (
          <OCRScanner
            onClose={() => setShowOCR(false)}
            onComplete={data => {
              const previous = JSON.parse(localStorage.getItem("ocr_documents") || "[]");
              localStorage.setItem("ocr_documents", JSON.stringify([data, ...previous].slice(0, 100)));
              setShowOCR(false);
            }}
          />
        );
      }

      if (showOCRHistory && currentOCRDoc) {
        return (
          <OCRDocumentViewer
            doc={currentOCRDoc}
            onBack={() => setCurrentOCRDoc(null)}
            onAddQuestionsToBank={questions => {
              const ocrBank = user.data?.ocrBank || [];
              const merged = [...questions, ...ocrBank];
              const upd = { ...user, data: { ...user.data, ocrBank: merged } };
              setUser(upd);
              setCurrentOCRDoc(null);
            }}
          />
        );
      }

      if (showOCRHistory) {
        return (
          <OCRHistoryScreen
            onBack={() => setShowOCRHistory(false)}
            onUseDocument={doc => setCurrentOCRDoc(doc)}
          />
        );
      }

      function renderScreen() {
        if (screen === "goals") {
          return <GoalsScreen user={user} setUser={setUser} onBack={() => nav("home")} />;
        }
        if (screen === "upgrade") {
          return <UpgradeScreen user={user} setUser={setUser} onBack={() => nav("home")} />;
        }
        return (
          <HomeScreen
            user={user}
            ctrl={ctrl}
            onSelectExam={e => setExamFlow({ stage: "instructions", exam: e })}
            onOpenOCR={() => setShowOCR(true)}
            onOpenOCRHistory={() => setShowOCRHistory(true)}
            onAddOCRQuestionsToBank={questions => {
              const ocrBank = user.data?.ocrBank || [];
              const merged = [...questions, ...ocrBank];
              const upd = { ...user, data: { ...user.data, ocrBank: merged } };
              setUser(upd);
            }}
          />
        );
      }

      const NAV = [
        { id: "home", label: "Home", icon: "🏠" },
        { id: "goals", label: "Goals", icon: "🎯" },
        { id: "upgrade", label: user.plan === "paid" && user.planExpiry > Date.now() ? "Premium" : "Upgrade", icon: "⚡" }
      ];

      return (
        <div style={{ height: "100vh", background: "#08101a", display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <div style={{ flex: 1, overflow: "hidden", position: "relative" }}>
            {renderScreen()}
          </div>
          <div style={{ background: "#060c18", borderTop: "1px solid #1a2840", display: "flex", flexShrink: 0 }}>
            {NAV.map(n => (
              <button key={n.id} onClick={() => nav(n.id)} style={{ flex: 1, padding: "10px 4px 8px", background: "none", border: "none", borderTop: `2px solid ${screen === n.id ? "#6366f1" : "transparent"}`, color: screen === n.id ? "#6366f1" : "#8892b0", fontSize: 10, fontWeight: 700, cursor: "pointer" }}>
                {n.icon} {n.label}
              </button>
            ))}
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    if (!rootElement) throw new Error("ExamForge root element was not found.");
    ReactDOM.createRoot(rootElement).render(<App />);

    window.addEventListener("error", function (event) {
      console.error(event.error || event.message);
    });
    window.addEventListener("unhandledrejection", function (event) {
      console.error(event.reason);
    });
  </script>
</body>
</html>
